name: Build debug APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: 'stable'

      - run: flutter pub get

      - run: flutter test

      # Debug builds are signed with the standard debug key, so the APK installs
      # without a release keystore. The ".dev" application id suffix lets it sit
      # alongside a release install of the app.
      - run: flutter build apk --debug

      - uses: actions/upload-artifact@v4
        with:
          name: hermes-android-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
